<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="NATION Guard">
  <rect width="920" height="240" rx="18" fill="#0a0d0b"/>
  <g stroke="#9fe870" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- capital (scroll volutes) -->
    <circle cx="110" cy="72" r="12"/>
    <circle cx="170" cy="72" r="12"/>
    <!-- abacus -->
    <line x1="90" y1="90" x2="190" y2="90"/>
    <!-- shaft fluting -->
    <line x1="113" y1="104" x2="113" y2="166"/>
    <line x1="140" y1="104" x2="140" y2="166"/>
    <line x1="167" y1="104" x2="167" y2="166"/>
    <!-- base + plinth -->
    <line x1="90" y1="178" x2="190" y2="178"/>
    <line x1="80" y1="195" x2="200" y2="195"/>
  </g>
  <text x="238" y="150" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="2">
    <tspan fill="#ffffff">NATION</tspan><tspan fill="#9fe870"> Guard</tspan>
  </text>
  <text x="242" y="194" font-family="'Courier New', monospace" font-size="26" fill="#8b9099" letter-spacing="1">Prompt-injection scanner &amp; integrity tool</text>
</svg>
