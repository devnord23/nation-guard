# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nation-guard"
version = "0.1.0"
description = "A local-first, offline guard for AI agent instruction/config files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "nation-guard contributors" }]
keywords = ["security", "ai-agents", "prompt-injection", "sast", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Operating System :: OS Independent",
]
# No runtime dependencies: stdlib only, by design.
dependencies = []

[project.urls]
Homepage = "https://github.com/devnord23/nation-guard"
Source = "https://github.com/devnord23/nation-guard"
Issues = "https://github.com/devnord23/nation-guard/issues"

[project.scripts]
nation-guard = "nation_guard.cli:main"
nation-guard-hook = "nation_guard.hook:main"
nation-guard-mcp = "nation_guard.mcp_server:main"

[tool.setuptools]
packages = ["nation_guard", "nation_guard.rules"]

[tool.setuptools.package-dir]
"nation_guard" = "guard/nation_guard"
"nation_guard.rules" = "rules"

[tool.setuptools.package-data]
"nation_guard.rules" = ["*.yaml"]
