# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline-capability check (no network/subprocess/exec under guard/)
        run: python tools/check_no_network.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Regenerated fixtures are in sync
        run: python corpus/generate.py && git diff --exit-code -- corpus/

  package:
    name: build & install (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean venv and smoke-test
        run: |
          python -m venv /tmp/ngvenv
          /tmp/ngvenv/bin/pip install dist/*.whl
          /tmp/ngvenv/bin/nation-guard --version
          /tmp/ngvenv/bin/nation-guard rules list | grep -q NG-WORM-001
          # Bundled rules must load from the installed package (not the repo).
          cd /tmp && /tmp/ngvenv/bin/nation-guard scan --root /tmp --format json >/dev/null

  self-scan:
    name: nation-guard scans itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan the repo (corpus fixtures are not config-named, so excluded)
        # Real gate: fails the job if the repo's own agent config files contain
        # a finding at/above high. (No `|| true`.)
        run: python -m nation_guard.cli scan --root . --format sarif --fail-on high > nation-guard.sarif
        env:
          PYTHONPATH: guard
      - name: Show report
        if: always()
        run: cat nation-guard.sarif
